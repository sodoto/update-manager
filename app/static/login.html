<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Update Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%233b82f6' d='M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z'/></svg>">
<link rel="stylesheet" href="static/style.css">
</head>
<body class="login-body">
<main class="login-card">
  <h1>Update Manager</h1>
  <p class="help">Sign in to continue.</p>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="login-error" id="loginError" role="alert" hidden></p>
    <button class="primary" type="submit" id="loginBtn">Sign in</button>
  </form>
</main>
<script src="static/login.js"></script>
</body>
</html>
