<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Updrift</title>
<link rel="icon" type="image/svg+xml" href="static/logo.svg">
<link rel="stylesheet" href="static/style.css">
</head>
<body class="login-body">
<main class="login-card">
  <img class="login-logo" src="static/logo.svg" alt="" width="48" height="48">
  <h1>Updrift</h1>
  <p class="help">Sign in to continue.</p>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="login-error" id="loginError" role="alert" hidden></p>
    <button class="primary" type="submit" id="loginBtn">Sign in</button>
  </form>
</main>
<script src="static/login.js"></script>
</body>
</html>
