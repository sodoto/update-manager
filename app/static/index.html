<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Updrift</title>
<link rel="icon" type="image/svg+xml" href="static/logo.svg">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand"><img src="static/logo.svg" alt="" width="28" height="28">Updrift</h1>
    <span class="ro-pill" id="modePill" title="Updrift only reads and checks. It never changes your Proxmox host, containers or Docker.">Read-only</span>
    <nav>
      <a href="#" id="navDashboard">Dashboard</a>
      <a href="#settings" id="navSettings">Settings</a>
    </nav>
    <span class="spacer"></span>
    <span class="meta" id="meta"></span>
    <span class="meta" id="version"></span>
    <button class="primary" id="checkBtn">Check now</button>
    <button id="logoutBtn" hidden>Log out</button>
  </header>

  <div id="appBanner"></div>

  <main id="dashboardView">
    <div class="cards" id="cards"></div>
    <div id="banner"></div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by name, image, host…">
      <button id="collapseAll">Collapse all</button>
      <select id="kind">
        <option value="">All types</option>
        <option value="docker">Docker containers</option>
        <option value="lxc">LXC containers</option>
        <option value="host">Proxmox hosts</option>
      </select>
    </div>
    <div id="list"></div>
  </main>

  <main id="settingsView" hidden></main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="modal-backdrop dialog-layer" id="dialog" hidden>
  <div class="modal dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogMsg">
    <h3 id="dialogTitle"></h3>
    <div id="dialogMsg"></div>
    <div class="dialog-actions">
      <button id="dialogCancel">Cancel</button>
      <button class="primary" id="dialogOk">OK</button>
    </div>
  </div>
</div>

<div class="savebar" id="savebar" hidden>
  <div class="inner">
    <span class="msg" id="saveMsg">You have unsaved changes</span>
    <button id="discardBtn">Discard</button>
    <button class="primary" id="saveBtn">Save settings</button>
  </div>
</div>

<script src="static/common.js"></script>
<script src="static/howto.js"></script>
<script src="static/appupdate.js"></script>
<script src="static/jobs.js"></script>
<script src="static/dashboard.js"></script>
<script src="static/settings.js"></script>
</body>
</html>
